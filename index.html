<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aarav Shah — Data Science &amp; Full-Stack Developer | Infinite Spider Web</title>
  <meta name="description" content="Portfolio of Aarav Shah, Data Science and Software Developer at NMIMS. Explore machine learning models, statistical deployments, and projects through an infinite organic glistening spider web.">
  <meta name="keywords" content="Aarav Shah, A101shah, Data Science, Machine Learning, Python, NMIMS, Infinite Spider Web, Dark Grey Theme">
  <meta name="author" content="Aarav Shah">

  <!-- Open Graph -->
  <meta property="og:title" content="Aarav Shah — Infinite Spider Web Portfolio">
  <meta property="og:description" content="Explore machine learning projects and statistical deployments through an infinite organic dewy spider web graph.">
  <meta property="og:type" content="website">

  <!-- Favicon SVG (Spider Web Glyph) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0b0e'/><polygon points='50,15 85,32 85,68 50,85 15,68 15,32' fill='none' stroke='%2300f0ff' stroke-width='4'/><polygon points='50,28 72,40 72,60 50,72 28,60 28,40' fill='none' stroke='%2300f0ff' stroke-width='3'/><line x1='50' y1='15' x2='50' y2='85' stroke='%2300f0ff' stroke-width='2'/><line x1='15' y1='32' x2='85' y2='68' stroke='%2300f0ff' stroke-width='2'/><line x1='15' y1='68' x2='85' y2='32' stroke='%2300f0ff' stroke-width='2'/><circle cx='50' cy='50' r='5' fill='%2300f0ff'/></svg>">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="web-only-mode">

  <!-- Background Living Infinite Organic Spider Web Canvas -->
  <canvas id="spider-web-canvas" aria-label="Interactive Infinite Spider Web Network"></canvas>

  <!-- Cybernetic Grid & Vignette Overlay -->
  <div class="web-vignette-overlay" aria-hidden="true"></div>

  <!-- Minimalist Top HUD Bar -->
  <header class="web-header" id="web-header">
    <div class="header-inner">
      <!-- Brand & Recenter -->
      <a href="#" class="brand-link" id="brand-reset-btn" title="Recenter Infinite Web to Nexus">
        <div class="brand-symbol">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/>
            <polygon points="12 6 18 10 18 14 12 18 6 14 6 10"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">AARAV SHAH</span>
          <span class="brand-meta">// DATA SCIENCE &bull; NMIMS</span>
        </div>
      </a>

      <!-- Quick Junction Selector Pills (Populated dynamically) -->
      <nav class="quick-nodes-nav" id="quick-nodes-nav" aria-label="Spider Web Project Junctions"></nav>

      <!-- External Links & Sound Synthesizer Controls -->
      <div class="header-actions">
        <!-- Direct GitHub Link -->
        <a href="https://github.com/A101shah" target="_blank" rel="noopener noreferrer" class="social-hud-btn" title="GitHub: @A101shah" aria-label="Aarav Shah GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span class="btn-text">GitHub</span>
        </a>

        <!-- Direct LinkedIn Link -->
        <a href="https://www.linkedin.com/in/aarav-shah-681641275/?isSelfProfile=true" target="_blank" rel="noopener noreferrer" class="social-hud-btn" title="LinkedIn Profile" aria-label="Aarav Shah LinkedIn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          <span class="btn-text">LinkedIn</span>
        </a>

        <!-- Sound Synthesizer Toggle Button -->
        <button class="sound-toggle-btn" id="sound-toggle-btn" title="Toggle Synthesizer Audio" aria-label="Toggle UI Audio">
          <div class="sound-indicator-bars">
            <span></span><span></span><span></span>
          </div>
          <span class="sound-toggle-label">AUDIO MUTED</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Floating Infinite Canvas Navigation Controls (Zoom & Recenter) -->
  <aside class="infinite-canvas-controls" aria-label="Canvas Pan and Zoom Controls">
    <button class="canvas-tool-btn" id="canvas-zoom-in" title="Zoom In (+)" aria-label="Zoom In">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="canvas-tool-btn" id="canvas-zoom-out" title="Zoom Out (-)" aria-label="Zoom Out">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="canvas-tool-btn" id="canvas-recenter-btn" title="Recenter to Nexus (0,0)" aria-label="Recenter to Nexus">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="3"/>
        <line x1="12" y1="2" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
      </svg>
    </button>
    <div class="canvas-coords-pill" id="hud-coords-display">
      X: +0 | Y: +0 | ZOOM: 1.00x
    </div>
  </aside>

  <!-- Atmospheric Bottom Hint Banner (Only in Spider Web Mode) -->
  <div class="web-instruction-hint" id="web-instruction-hint">
    <div class="hint-pill">
      <span class="hint-pulse-dot"></span>
      <span>DRAG TO PAN &bull; SCROLL TO ZOOM &bull; CLICK SILK GUIDES TO GLIDE BETWEEN WEBS &bull; CLICK CENTER GLOW TO OPEN KEY CARD</span>
    </div>
  </div>

  <!-- ======================================================================
       KEY CARD MODAL / POPUP OVERLAY SYSTEM
       ====================================================================== -->
  <div class="key-card-overlay" id="key-card-overlay" role="dialog" aria-modal="true" aria-labelledby="card-node-code">
    <!-- Click backdrop to return to spider web only -->
    <div class="key-card-backdrop" id="key-card-backdrop"></div>

    <!-- The Active Key Card Container -->
    <article class="key-card-container glass-card" id="key-card-container">
      
      <!-- Card Header -->
      <div class="key-card-header">
        <div class="card-node-badge">
          <span class="card-beacon-dot"></span>
          <span id="card-node-code">NODE_00 // NEXUS</span>
          <span class="badge-tag" id="card-node-badge">SYSTEM CORE</span>
        </div>

        <div class="card-controls">
          <!-- Quick Node Step Buttons -->
          <div class="card-nav-steppers">
            <button class="stepper-btn" id="card-prev-btn" title="Previous Node">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
              <span>Prev</span>
            </button>
            <button class="stepper-btn" id="card-next-btn" title="Next Node">
              <span>Next</span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>

          <!-- Return to Spider Web Button -->
          <button class="card-close-btn" id="card-close-btn" title="Close and return to Spider Web" aria-label="Close Key Card">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <!-- Card Dynamic Content Body -->
      <div class="key-card-body" id="key-card-dynamic-body">
        <!-- Rendered dynamically by main.js based on clicked node -->
      </div>

      <!-- Card Footer Bar -->
      <div class="key-card-footer">
        <div class="card-footer-info">
          <span class="mono text-muted text-xs">// INTERSECTION ANCHOR: VERIFIED</span>
        </div>
        <div class="card-footer-actions">
          <button class="btn btn-secondary btn-sm" id="card-return-web-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/></svg>
            Return to Spider Web
          </button>
        </div>
      </div>

    </article>
  </div>

  <!-- Scripts -->
  <script src="js/portfolio-data.js?v=10"></script>
  <script src="js/audio-effects.js?v=10"></script>
  <script src="js/spider-web.js?v=10"></script>
  <script src="js/interactive-terminal.js?v=10"></script>
  <script src="js/main.js?v=10"></script>
</body>
</html>
